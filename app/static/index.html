<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer Club Updates</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color:#172033; background:#f4f6f8; --red:#da291c; --navy:#121d2e; --line:#e3e7ed; }
    * { box-sizing:border-box } body { margin:0 } button,input,select { font:inherit } button { cursor:pointer }
    [hidden] { display:none!important } .auth { width:min(440px,calc(100%-32px)); margin:72px auto } .auth-card,.panel { background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px #17203310 }
    .auth-card { padding:28px } .auth h1 { font-size:1.8rem } .tabs { display:flex;gap:8px;margin-bottom:20px } .auth button { min-height:42px;border:0;border-radius:8px;padding:9px 14px;color:#fff;background:var(--navy);font-weight:700 }
    .auth button.secondary { color:#263248;background:#e9edf4 } label { display:block;margin:16px 0 6px;font-weight:650 } input,select { width:100%;min-height:44px;padding:9px 11px;border:1px solid #ccd4df;border-radius:8px;background:#fff }
    form > button { width:100%;margin-top:20px } #notice { min-height:24px;color:#17613c } #notice.error { color:#a32132 }
    .shell { display:grid;grid-template-columns:236px 1fr;min-height:100vh } .sidebar { background:var(--navy);color:#dfe5ef;padding:24px 14px } .brand { display:flex;gap:10px;align-items:center;padding:0 8px 28px;color:#fff;font-weight:800 } .crest { display:grid;width:38px;height:38px;place-items:center;border:2px solid #fff;border-radius:50%;color:#fff;background:var(--red);font-size:.72rem }
    .nav-label { margin:12px 8px 8px;color:#8592a7;font-size:.68rem;font-weight:800;letter-spacing:.12em } .nav { display:grid;gap:5px } .nav button { display:flex;gap:10px;align-items:center;min-height:44px;border:0;border-radius:9px;padding:0 10px;color:#bcc6d5;background:transparent;text-align:left }
    .nav button:hover,.nav button[aria-current] { color:#fff;background:#26354a } .workspace { min-width:0 } .topbar { display:flex;align-items:center;justify-content:space-between;min-height:78px;padding:0 38px;border-bottom:1px solid var(--line);background:#fff } .topbar h1 { margin:0;font-size:1.1rem } .topbar p { margin:4px 0 0;color:#8993a3;font-size:.78rem }
    .top-actions { display:flex;gap:8px }.top-actions button { min-height:40px;border:0;border-radius:8px;padding:8px 12px;color:#263248;background:#edf0f4;font-weight:700 }.top-actions #logout { color:#fff;background:var(--red) }
    .content { padding:32px 38px 48px }.welcome { display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:20px }.welcome h2 { margin:0 0 5px;font-size:1.7rem }.welcome p { margin:0;color:#7c8797 }.club-select { display:flex;gap:8px }.club-select select { width:150px }
    .cards { display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px }.panel { padding:19px }.metric-label { color:#808c9d;font-size:.78rem }.metric { margin:10px 0 6px;font-size:1.55rem;font-weight:800 }.metric-change { color:#168b65;font-size:.75rem }
    .main-grid { display:grid;grid-template-columns:1.55fr 1fr;gap:14px }.match-card { background:linear-gradient(135deg,#19283a,#2c3b50);color:#fff }.match-card p { color:#bdc7d5 }.versus { display:flex;justify-content:space-around;align-items:center;padding:22px 8px }.team { text-align:center }.badge { display:grid;width:64px;height:64px;margin:0 auto 10px;place-items:center;border:2px solid #fff;border-radius:50%;background:var(--red);font-weight:900 }.away { background:#b8bbc2;color:#fff } .score { font-size:1.5rem;font-weight:900 }
    .form-list { display:grid;grid-template-columns:repeat(5,1fr);gap:6px }.form-dot { display:grid;height:34px;place-items:center;border-radius:7px;background:#edf1f5;font-size:.72rem;font-weight:800 }.form-dot.win { background:#e3f5ec;color:#168b65 }.form-dot.loss { background:#fdebe8;color:#c04a40 }.form-dot.draw { background:#fff2d8;color:#9b731e }
    .news { margin-top:14px }.news-head { display:flex;justify-content:space-between }.news-item { display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;border-top:1px solid #eef1f4;padding:14px 0 }.news-mark { display:grid;width:56px;height:56px;place-items:center;border-radius:10px;background:#f1f3f6;color:var(--red);font-weight:800 }.news-item h3 { margin:0 0 5px;font-size:.92rem }.news-item p { margin:0;font-size:.75rem }.fake-page { min-height:260px }
    .data-status { display:flex;align-items:center;gap:10px;margin-bottom:14px;color:#596579;font-size:.82rem }.status-pill { border-radius:999px;padding:5px 10px;font-weight:800;text-transform:capitalize }.status-pill.fresh { background:#e3f5ec;color:#17613c }.status-pill.stale { background:#fff2d8;color:#8a6413 }.status-pill.unavailable { background:#fdebe8;color:#a32132 }.data-table { width:100%;border-collapse:collapse;font-size:.88rem }.data-table th,.data-table td { border-bottom:1px solid #eef1f4;padding:10px 8px;text-align:left;white-space:nowrap }.data-table th { color:#778295;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em }.table-wrap { overflow:auto }.section-title { margin:20px 0 10px;font-size:1.05rem }.muted { color:#778295 }
    .table-wrap { max-height:65vh;overflow:auto }.table-wrap:focus-visible { outline:2px solid var(--red);outline-offset:2px }
    .favorite-row,.favorite-match-row { background:#fff7e8 }.favorite-marker { display:inline-block;margin-left:8px;border-radius:999px;padding:3px 7px;background:#ffe5a8;color:#654600;font-size:.68rem;font-weight:800 }
    .team-crest { display:inline-grid;width:30px;height:30px;flex:0 0 auto;place-items:center;overflow:hidden;border:1px solid #d5dbe3;border-radius:50%;background:#fff;color:var(--navy);font-size:.62rem;font-weight:800 }
    .team-crest img { width:100%;height:100%;object-fit:contain }.team-crest.large { width:48px;height:48px;font-size:.8rem }
    .favorite-preview,.team-heading { display:flex;align-items:center;gap:12px }.favorite-preview { margin-top:12px }.team-heading { margin-bottom:18px }.team-heading h2 { margin:0 0 4px }.team-heading p { margin:0;color:#778295 }
    @media(max-width:900px) {.cards{grid-template-columns:repeat(2,1fr)}.main-grid{grid-template-columns:1fr}.shell{grid-template-columns:200px 1fr}}@media(max-width:680px){.shell{display:block}.sidebar{padding:12px}.brand{padding:0 4px 10px}.nav-label{display:none}.nav{display:flex;overflow-x:auto}.nav button{min-width:max-content}.topbar{padding:0 18px}.content{padding:24px 18px}.cards{gap:8px}.welcome{align-items:start;flex-direction:column}.club-select{width:100%}.club-select select{flex:1}}
  </style>
</head>
<body>
  <main id="auth-layout" class="auth">
    <h1>Soccer Club Updates</h1><p>Follow your club, fixtures, news and form.</p>
    <section id="auth-panel" class="auth-card">
      <h2>Welcome</h2>
      <div class="tabs"><button id="signin-tab">Sign in</button><button id="signup-tab" class="secondary">Create account</button></div>
      <form id="signin-form">
        <label for="username">Username</label><input id="username" autocomplete="username" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <form id="signup-form" hidden>
        <label for="signup-username">Username</label><input id="signup-username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]+" required>
        <label for="signup-password">Password</label><input id="signup-password" type="password" minlength="8" maxlength="128" required>
        <button type="submit">Create account</button>
      </form>
    </section>
  </main>
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="crest">PL</span><span>Premier League Hub</span></div>
      <p class="nav-label">FOLLOW</p>
      <nav class="nav" aria-label="Main navigation">
        <button data-view="home" aria-current="true">◉ Overview</button>
        <button data-view="favorite" id="favorite-nav" hidden></button>
        <button data-view="matches">▦ Matches</button>
        <button data-view="news">◫ News</button>
        <button data-view="squad">♙ Squad</button>
        <button data-view="table">▥ Table</button>
      </nav>
      <p class="nav-label">ACCOUNT</p>
      <nav class="nav"><button data-view="password">⚙ Password</button></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div><h1 id="page-title">Overview</h1><p id="page-subtitle">Premier League updates</p></div>
        <div class="top-actions"><button id="account">Account</button><button id="logout">Log out</button></div>
      </header>
      <main id="content" class="content"></main>
    </div>
  </div>
  <p id="notice" role="status" aria-live="polite"></p>
  <template id="home-template"><section class="welcome"><div><h2>Good to see you, <span id="welcome-user"></span></h2><p>Premier League standings, recent results and upcoming fixtures.</p></div></section><div id="overview-content" aria-live="polite">Loading league data…</div></template>
  <template id="matches-template"><section class="welcome"><div><h2>Matches</h2><p>Premier League fixtures and results across all teams.</p></div></section><div id="matches-content" aria-live="polite">Loading fixtures…</div></template>
  <template id="news-template"><section class="welcome"><div><h2>Club news</h2><p>News coverage is outside the football-data.org integration.</p></div></section><article class="panel"><p>News is not collected in this release.</p></article></template>
  <template id="squad-template"><section class="welcome"><div><h2>Squad</h2><p>Squad coverage is outside the football-data.org integration.</p></div></section><article class="panel"><p>Squad data is not collected in this release.</p></article></template>
  <template id="table-template"><section class="welcome"><div><h2>Premier League table</h2><p>Current standings for every collected league team.</p></div></section><div id="table-content" aria-live="polite">Loading standings…</div></template>
  <template id="favorite-template"><section class="welcome"><div><h2 id="favorite-heading">Favourite team</h2><p>Standings, recent results and upcoming fixtures for your team.</p></div></section><div id="favorite-content" aria-live="polite">Loading team data…</div></template>
  <template id="password-template"><section class="welcome"><div><h2>Account</h2><p>Manage your favourite team and password.</p></div></section><article class="panel"><h3 class="section-title">Favourite team</h3><form id="favorite-form"><label for="favorite-team-select">Choose a favourite team</label><select id="favorite-team-select"><option value="">No favourite team</option></select><div id="favorite-preview" class="favorite-preview" aria-live="polite"></div><button type="submit">Save favourite team</button><p id="favorite-status" role="status" class="muted"></p></form></article><article class="panel"><h3 class="section-title">Change password</h3><form id="password-form"><label for="current-password">Current password</label><input id="current-password" type="password" required><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" required><button type="submit">Update password</button></form><p id="demo-notice" hidden>The demo account cannot change its password.</p></article></template>
  <script>
    const authLayout=document.querySelector("#auth-layout"),authPanel=document.querySelector("#auth-panel"),shell=document.querySelector("#shell"),content=document.querySelector("#content"),notice=document.querySelector("#notice"),tokenKey="soccer-access-token";
    let currentUser="",favoriteTeamId=null,leagueCache=null;
    const viewTitles={home:["Overview","Premier League"],favorite:["Favourite team","Team standings, recent results and upcoming fixtures"],matches:["Matches","All Premier League teams"],news:["Club news","Not included in this data integration"],squad:["Squad","Not included in this data integration"],table:["Premier League table","All current-season standings"],password:["Account","Manage your favourite team and password"]};
    function showNotice(message,kind=""){notice.textContent=message;notice.className=kind}
    async function request(path,options={}){const headers=new Headers(options.headers||{});if(options.body)headers.set("Content-Type","application/json");const token=sessionStorage.getItem(tokenKey);if(token)headers.set("Authorization",`Bearer ${token}`);const response=await fetch(path,{...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||"Request failed");return data}
    function showSignedOut(){sessionStorage.removeItem(tokenKey);shell.hidden=true;authLayout.hidden=false;document.querySelector("#signin-form").hidden=false;document.querySelector("#signup-form").hidden=true}
    function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
    function formatKickoff(value){const date=new Date(value);return Number.isNaN(date.getTime())?escapeHtml(value):new Intl.DateTimeFormat(undefined,{year:"numeric",month:"short",day:"numeric",hour:"numeric",minute:"2-digit",timeZone:"UTC",timeZoneName:"short"}).format(date)}
    function freshnessMarkup(status){const stamp=status.last_updated?` · Last updated ${formatKickoff(status.last_updated)}`:"";const error=status.error_summary?` · ${escapeHtml(status.error_summary)}`:"";return `<div class="data-status"><span class="status-pill ${escapeHtml(status.freshness)}">${escapeHtml(status.freshness)}</span><span>Collection mode: ${escapeHtml(status.mode)}${stamp} · ${escapeHtml(status.provider_calls_remaining)} provider calls remain this hour${error}</span></div>`}
    function standingsTable(rows,label="League standings",highlightTeamId=null){return `<div class="table-wrap" role="region" aria-label="${escapeHtml(label)}" tabindex="0"><table class="data-table"><thead><tr><th>Pos</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map(row=>`<tr${row.team_id===highlightTeamId?' class="favorite-row"':''}><td>${escapeHtml(row.position)}</td><td>${escapeHtml(row.team_name)}${row.team_id===highlightTeamId?'<span class="favorite-marker">Favourite</span>':""}</td><td>${escapeHtml(row.played_games)}</td><td>${escapeHtml(row.won)}</td><td>${escapeHtml(row.draw)}</td><td>${escapeHtml(row.lost)}</td><td>${escapeHtml(row.goal_difference)}</td><td><strong>${escapeHtml(row.points)}</strong></td></tr>`).join("")}</tbody></table></div>`}
    function matchesTable(rows,label="All league matches",highlightTeamId=null){return `<div class="table-wrap" role="region" aria-label="${escapeHtml(label)}" tabindex="0"><table class="data-table"><thead><tr><th>Kickoff (UTC)</th><th>Home</th><th>Score</th><th>Away</th><th>Status</th><th>Venue</th></tr></thead><tbody>${rows.map(match=>{const homeFavorite=match.home_team_id===highlightTeamId,awayFavorite=match.away_team_id===highlightTeamId;return `<tr${homeFavorite||awayFavorite?' class="favorite-match-row"':''}><td>${match.utc_date?formatKickoff(match.utc_date):"—"}</td><td>${escapeHtml(match.home_team_name)}${homeFavorite?'<span class="favorite-marker">Favourite</span>':""}</td><td>${escapeHtml(match.home_score??"—")} – ${escapeHtml(match.away_score??"—")}</td><td>${escapeHtml(match.away_team_name)}${awayFavorite?'<span class="favorite-marker">Favourite</span>':""}</td><td>${escapeHtml(match.status)}</td><td>${escapeHtml(match.venue||"—")}</td></tr>`}).join("")}</tbody></table></div>`}
    function overviewMarkup(data){
      const competition=data.competition,season=data.season;
      if(!competition||!season)return `<article class="panel"><p>League data is unavailable. The collector has not completed a successful run.</p></article>`;
      const recent=data.matches.filter(match=>match.status==="FINISHED").slice(-10).reverse(),upcoming=data.matches.filter(match=>["TIMED","SCHEDULED"].includes(match.status)).slice(0,10);
      const fixtureRows=(matches,label)=>matches.length?matchesTable(matches,label,favoriteTeamId):`<p class="muted">No fixtures in this category are available.</p>`;
      return `<section class="cards"><article class="panel"><span class="metric-label">Competition</span><p class="metric">${escapeHtml(competition.name)}</p><span class="metric-change">${escapeHtml(competition.code)}</span></article><article class="panel"><span class="metric-label">Season</span><p class="metric">${escapeHtml(season.start_date||"—")}</p><span class="metric-change">Through ${escapeHtml(season.end_date||"—")}</span></article><article class="panel"><span class="metric-label">Teams</span><p class="metric">${escapeHtml(data.teams.length)}</p><span class="metric-change">Premier League</span></article><article class="panel"><span class="metric-label">Current matchday</span><p class="metric">${escapeHtml(season.current_matchday||"—")}</p><span class="metric-change">Competition schedule</span></article></section><article class="panel"><h3 class="section-title">Standings snapshot</h3>${standingsTable(data.standings,"All league standings",favoriteTeamId)}</article><article class="panel news"><h3 class="section-title">Recent results</h3>${fixtureRows(recent,"Overview recent results")}</article><article class="panel news"><h3 class="section-title">Upcoming fixtures</h3>${fixtureRows(upcoming,"Overview upcoming fixtures")}</article>`;
    }
    function favoriteTeamMarkup(data){
      if(favoriteTeamId===null)return `<article class="panel"><p>Select a favourite team from Account to see team-specific data.</p></article>`;
      const team=data.teams.find(item=>item.id===favoriteTeamId);
      if(!team)return `<article class="panel"><p>Your saved favourite team is not available in the current league data.</p></article>`;
      const standing=data.standings.find(row=>row.team_id===favoriteTeamId);
      const involved=match=>match.home_team_id===favoriteTeamId||match.away_team_id===favoriteTeamId;
      const kickoff=match=>new Date(match.utc_date||0).getTime()||0;
      const recent=data.matches.filter(match=>involved(match)&&match.status==="FINISHED").sort((a,b)=>kickoff(b)-kickoff(a)).slice(0,10);
      const upcoming=data.matches.filter(match=>involved(match)&&["TIMED","SCHEDULED"].includes(match.status)).sort((a,b)=>kickoff(a)-kickoff(b)).slice(0,10);
      return `<section class="team-heading"><div id="favorite-team-crest"></div><div><h2>${escapeHtml(team.name)}</h2><p>Team standings, recent results and upcoming fixtures</p></div></section>${standing?`<article class="panel"><h3 class="section-title">League standing</h3>${standingsTable([standing],"Favourite team standing",favoriteTeamId)}</article>`:`<article class="panel"><p>No current league standing is available for ${escapeHtml(team.name)}.</p></article>`}<article class="panel news"><h3 class="section-title">Recent results</h3>${recent.length?matchesTable(recent,`${team.name} recent results`):`<p class="muted">No recent results are available for ${escapeHtml(team.name)}.</p>`}</article><article class="panel news"><h3 class="section-title">Upcoming fixtures</h3>${upcoming.length?matchesTable(upcoming,`${team.name} upcoming fixtures`):`<p class="muted">No upcoming fixtures are available for ${escapeHtml(team.name)}.</p>`}</article>`;
    }
    function getFavoriteTeam(){return leagueCache?.teams.find(team=>team.id===favoriteTeamId)||null}
    function safeCrestUrl(value){try{const url=new URL(value);return url.protocol==="https:"?url.href:null}catch{return null}}
    function teamInitials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,3).map(word=>word[0]).join("").toUpperCase()||"FC"}
    function createTeamBadge(team,large=false){
      const badge=document.createElement("span");badge.className=`team-crest${large?" large":""}`;badge.setAttribute("aria-hidden","true");
      const initials=teamInitials(team?.name),crest=safeCrestUrl(team?.crest);
      if(!crest){badge.textContent=initials;return badge}
      const image=document.createElement("img");image.src=crest;image.alt="";
      image.addEventListener("error",()=>{badge.replaceChildren();badge.textContent=initials},{once:true});badge.append(image);return badge;
    }
    function renderFavoriteNavigation(){
      const button=document.querySelector("#favorite-nav");
      if(favoriteTeamId===null){button.hidden=true;button.replaceChildren();return}
      const team=getFavoriteTeam();button.hidden=false;button.setAttribute("aria-label",team?.name||"Favourite team");button.replaceChildren(createTeamBadge(team),document.createTextNode(team?.name||"Favourite team"));
    }
    function populateFavoriteTeams(data){
      const select=content.querySelector("#favorite-team-select");if(!select)return;
      select.replaceChildren();const empty=document.createElement("option");empty.value="";empty.textContent="No favourite team";select.append(empty);
      const teams=[...(data?.teams||[])].sort((a,b)=>a.name.localeCompare(b.name));
      if(favoriteTeamId!==null&&!teams.some(team=>team.id===favoriteTeamId)){const saved=document.createElement("option");saved.value=String(favoriteTeamId);saved.textContent=`Saved team ${favoriteTeamId} (not in current data)`;select.append(saved)}
      for(const team of teams){const option=document.createElement("option");option.value=String(team.id);option.textContent=team.name;select.append(option)}
      select.value=favoriteTeamId===null?"":String(favoriteTeamId);
      updateFavoritePreview();
    }
    function updateFavoritePreview(){
      const preview=content.querySelector("#favorite-preview"),select=content.querySelector("#favorite-team-select");if(!preview||!select)return;
      const team=leagueCache?.teams.find(item=>String(item.id)===select.value);preview.replaceChildren();
      if(team){preview.append(createTeamBadge(team,true));const label=document.createElement("span");label.textContent=team.name;preview.append(label)}
    }
    async function loadFavoriteSettings(){
      const status=content.querySelector("#favorite-status"),form=content.querySelector("#favorite-form");if(!form)return;
      form.onsubmit=async event=>{event.preventDefault();const select=content.querySelector("#favorite-team-select");const selected=select.value?Number(select.value):null;try{const account=await request("/auth/account",{method:"PATCH",body:JSON.stringify({favorite_team_id:selected})});favoriteTeamId=account.favorite_team_id;renderFavoriteNavigation();populateFavoriteTeams(leagueCache);status.textContent=favoriteTeamId===null?"Favourite team cleared.":"Favourite team saved.";showNotice(status.textContent,"success")}catch(error){status.textContent=error.message;showNotice(error.message,"error")}};
      content.querySelector("#favorite-team-select").onchange=updateFavoritePreview;
      const [accountResult,leagueResult]=await Promise.allSettled([request("/auth/account"),request("/api/v1/league")]);
      if(accountResult.status==="fulfilled"){favoriteTeamId=accountResult.value.favorite_team_id;renderFavoriteNavigation()}
      if(leagueResult.status==="fulfilled"){leagueCache=leagueResult.value;renderFavoriteNavigation();populateFavoriteTeams(leagueCache);status.textContent=leagueCache.teams.length?"Choose a team or clear your favourite.":"Team choices will be available after league data is collected."}
      else{leagueCache=null;populateFavoriteTeams(null);status.textContent=`League teams could not be loaded: ${leagueResult.reason.message}`}
      if(accountResult.status==="rejected")status.textContent=`Account preferences could not be loaded: ${accountResult.reason.message}`;
    }
    async function loadLeagueData(view){
      const target=content.querySelector(`#${view==="home"?"overview":view}-content`);if(!target)return;
      try{
        const data=await request("/api/v1/league");if(!content.contains(target))return;
        leagueCache=data;renderFavoriteNavigation();
        const status=data.collection_status;let body;
        if(view==="favorite"){body=favoriteTeamMarkup(data)}
        else if(status.freshness==="unavailable"||!data.competition){body=`<article class="panel"><p>League data is unavailable. The collector has not completed a successful run.</p></article>`}
        else if(view==="home"){body=overviewMarkup(data)}
        else if(view==="matches"){body=data.matches.length?matchesTable(data.matches):`<article class="panel"><p>No fixtures or results are available yet.</p></article>`}
        else{body=data.standings.length?standingsTable(data.standings):`<article class="panel"><p>No standings are available yet.</p></article>`}
        target.innerHTML=freshnessMarkup(status)+body;
        if(view==="favorite"){
          const team=getFavoriteTeam();const heading=content.querySelector("#favorite-heading");
          if(team){document.querySelector("#page-title").textContent=team.name;document.querySelector("#page-subtitle").textContent="Team standings, recent results and upcoming fixtures";if(heading)heading.textContent=team.name;const crestTarget=content.querySelector("#favorite-team-crest");if(crestTarget)crestTarget.append(createTeamBadge(team,true))}
          else if(heading){document.querySelector("#page-title").textContent="Favourite team"}
        }
      }catch(error){if(content.contains(target))target.innerHTML=`<article class="panel"><p role="status">League data could not be loaded: ${escapeHtml(error.message)}</p></article>`}
    }
    function setView(view){
      const template=document.querySelector(`#${view}-template`);if(!template)return;
      const title=view==="favorite"?[getFavoriteTeam()?.name||"Favourite team","Team standings, recent results and upcoming fixtures"]:viewTitles[view];
      document.querySelector("#page-title").textContent=title[0];document.querySelector("#page-subtitle").textContent=title[1];content.replaceChildren(template.content.cloneNode(true));
      document.querySelectorAll(".nav button").forEach(button=>{if(button.dataset.view===view)button.setAttribute("aria-current","true");else button.removeAttribute("aria-current")});
      if(view==="home")content.querySelector("#welcome-user").textContent=currentUser;
      if(["home","favorite","matches","table"].includes(view))loadLeagueData(view);
      if(view==="password"){bindPasswordForm();loadFavoriteSettings()}
    }
    async function showSignedIn(){const account=await request("/auth/account");currentUser=account.username;favoriteTeamId=account.favorite_team_id;renderFavoriteNavigation();authLayout.hidden=true;shell.hidden=false;setView("home")}
    document.querySelector("#signin-tab").onclick=()=>{document.querySelector("#signin-form").hidden=false;document.querySelector("#signup-form").hidden=true};
    document.querySelector("#signup-tab").onclick=()=>{document.querySelector("#signin-form").hidden=true;document.querySelector("#signup-form").hidden=false};
    document.querySelector("#signin-form").onsubmit=async event=>{event.preventDefault();const formElement=event.currentTarget;try{const result=await request("/auth/login",{method:"POST",body:JSON.stringify({username:document.querySelector("#username").value,password:document.querySelector("#password").value})});sessionStorage.setItem(tokenKey,result.access_token);formElement.reset();await showSignedIn();showNotice("You are signed in.","success")}catch(error){showNotice(error.message,"error")}};
    document.querySelector("#signup-form").onsubmit=async event=>{event.preventDefault();const formElement=event.currentTarget;try{const username=document.querySelector("#signup-username").value,password=document.querySelector("#signup-password").value;await request("/auth/signup",{method:"POST",body:JSON.stringify({username,password})});const result=await request("/auth/login",{method:"POST",body:JSON.stringify({username,password})});sessionStorage.setItem(tokenKey,result.access_token);formElement.reset();await showSignedIn();showNotice("Account created and signed in.","success")}catch(error){showNotice(error.message,"error")}};
    document.querySelectorAll(".nav button").forEach(button=>button.onclick=()=>setView(button.dataset.view));
    document.querySelector("#logout").onclick=()=>{showSignedOut();showNotice("You are signed out.","success")};
    document.querySelector("#account").onclick=()=>setView("password");
    function bindPasswordForm(){const form=content.querySelector("#password-form");if(!form)return;form.onsubmit=async event=>{event.preventDefault();try{const result=await request("/auth/change-password",{method:"POST",body:JSON.stringify({current_password:document.querySelector("#current-password").value,new_password:document.querySelector("#new-password").value})});showSignedOut();showNotice(`${result.message}. Sign in with your new password.`,"success")}catch(error){showNotice(error.message,"error")}}}
    if(sessionStorage.getItem(tokenKey)){showSignedIn().catch(()=>showSignedOut())}
  </script>
</body>
</html>
